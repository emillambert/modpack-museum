name: build

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Static repository validation
        run: ./scripts/validate-static.sh

      - name: Pure core conservation smoke test
        run: ./scripts/test-pure-core.sh

      - name: Build and unit test
        run: ./gradlew clean test build --stacktrace

      - name: Fabric server boot smoke test
        run: ./scripts/ci-server-smoke.sh

      - name: Upload build and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modpack-museum-build-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            server-smoke.log
