services:
  minecraft:
    image: itzg/minecraft-server:2026.9.1-java25
    container_name: modpack-museum-dev
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.3"
      ONLINE_MODE: "TRUE"
      ENABLE_COMMAND_BLOCK: "FALSE"
      MEMORY: "4G"
      MOTD: "Modpack Museum — development"
      # Polymer is bundled inside the project jar; Fabric API remains a normal server dependency.
      MODRINTH_PROJECTS: |
        fabric-api
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    volumes:
      - ./runtime:/data
      - ./local-mods:/mods:ro
      - ./config/polymer:/data/config/polymer
    restart: unless-stopped
