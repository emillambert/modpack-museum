plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.x is unobfuscated, so there is intentionally no mappings dependency.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Bundle the Polymer runtime pieces we directly depend on so the deployed server only
    // needs Fabric API plus this project jar. This mirrors current 26.2 Polymer projects.
    implementation include("eu.pb4:polymer-core:${project.polymer_version}")
    implementation include("eu.pb4:polymer-blocks:${project.polymer_version}")
    implementation include("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    include("eu.pb4:polymer-autohost:${project.polymer_version}")

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
